<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nutrient Map Debug</title>
    <style>
        body { font-family: Arial; text-align: center; }
        svg { border: 1px solid #ccc; background: white; }
        circle { stroke: #fff; stroke-width: 2px; cursor: pointer; }
        text { font-weight: bold; fill: black; stroke: white; stroke-width: 0.5px; pointer-events: none; }
    </style>
</head>
<body>

<h2>Peta Nutrisi (Debug Mode)</h2>
<div id="chart"></div>
<div id="details" style="padding: 20px; width: 80%; margin: auto; border-top: 1px solid #ddd;">
    <strong>Pilih node untuk info:</strong>
</div>

<!-- Muat D3 dari CDN -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    // Data Sederhana & Teruji
    const nodes = [
        {id: 'Zn', name: 'Zinc'}, 
        {id: 'Mg', name: 'Magnesium'}, 
        {id: 'Ca', name: 'Kalsium'}, 
        {id: 'D3', name: 'Vit D3'}
    ];

    const links = [
        {source: 'Zn', target: 'Mg'},
        {source: 'Ca', target: 'Mg'},
        {source: 'Mg', target: 'D3'}
    ];

    const width = 800, height = 500;

    if (!window.d3) {
        document.body.innerHTML = "<h1 style='color:red'>ERROR: Pustaka D3.js tidak dapat dimuat.<br/>Coba matikan AdBlocker atau ganti browser.</h1>";
        return;
    }

    const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width/2, height/2));

    const linkElement = svg.append("g")
        .selectAll("line")
        .data(links)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-width", 2);

    const nodeElement = svg.append("g")
        .selectAll("circle")
        .data(nodes)
        .enter()
        .append("circle")
        .attr("r", 25)
        .attr("fill", "#4a90e2")
        .on("click", function(event, d) {
            document.getElementById('details').innerHTML = 
                "<strong>Anda memilih:</strong> " + d.name + "<br>" +
                "ID Internal: " + d.id;
        });

    // Tambahkan label teks DI ATAS lingkaran
    nodeElement.append("text")
        .attr("dy", "0.35em")
        .attr("text-anchor", "middle")
        .text(d => d.id);

    simulation.on("tick", () => {
        linkElement
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        nodeElement.attr("transform", d => `translate(${d.x},${d.y})`);
    });
</script>

</body>
</html>
