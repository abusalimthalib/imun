<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Narrative Network</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    h1 { text-align: center; color: #333; }
    #graph-container { width: 100%; height: 500px; border: 1px solid #ccc; background: white; margin-bottom: 20px; }
    #info-box { padding: 15px; background: white; border: 1px solid #ccc; min-height: 100px; }
    .node text { pointer-events: none; font-weight: bold; font-size: 11px; fill: black; stroke: white; stroke-width: 1px; }
    .link-line { stroke-opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Peta Interaksi Nutrisi & Sel T</h1>
  <div id="graph-container"></div>
  <div id="info-box">Klik pada lingkaran untuk melihat detail narasi.</div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // DATA MURNI - AMAN DI-PARSE
    const data = {
      nodes: [
        {id: "Zn", label: "Zinc", role: "Diferensiasi sel T dan integritas mukosa.", type: "mineral"},
        {id: "Mg", label: "Magnesium", role: "Aktivator Vitamin D dan stabil mitokondria.", type: "mineral"},
        {id: "Fe", label: "Besi", role: "Proliferasi limfosit, tapi hati-hati radikal bebas.", type: "mineral"},
        {id: "Ca", label: "Kalsium", role: "Signaling sel, namun berlebih menghambat Mg/Zn.", type: "mineral"},
        {id: "Cu", label: "Tembakau", role: "Fungsi sitotoksik sel T.", type: "mineral"},
        {id: "B", label: "Boron", role: "Modulator inflamasi halus.", type: "mineral"},
        {id: "VitD", label: "Vit D3", role: "Imunoregulasi dan anti-autoimun.", type: "vitamin"},
        {id: "VitA", label: "Vit A", role: "Epitel saluran napas.", type: "vitamin"},
        {id: "VitC", label: "Vit C", role: "Antioksidan utama sel imun.", type: "vitamin"}
      ],
      links: [
        {source: "Zn", target: "Mg", type: "synergy", note: "Saling mendukung homeostasis."},
        {source: "Mg", target: "VitD", type: "synergy", note: "Mg wajib untuk aktivasi Vit D."},
        {source: "Ca", target: "Mg", type: "antagonist", note: "Persaingan penyerapan di usus."},
        {source: "Ca", target: "Zn", type: "antagonist", note: "Ca tinggi hambat Zn."},
        {source: "Zn", target: "Cu", type: "antagonist", note: "Rasio harus dijaga seimbang."},
        {source: "Fe", target: "VitC", type: "synergy", note: "Vit C bantu serap Fe nabati."},
        {source: "B", target: "Mg", type: "support", note: "Boron tingkatkan retensi Mg."}
      ]
    };

    const width = document.getElementById("graph-container").clientWidth;
    const height = 500;

    const svg = d3.select("#graph-container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    // SIMULASI GAYA
    const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.id))
      .force("charge", d3.forceManyBody().strength(-300))
      .force("center", d3.forceCenter(width / 2, height / 2));

    // GAMBAR GARIS
    const link = svg.append("g")
      .selectAll("line")
      .data(data.links)
      .enter()
      .append("line")
      .attr("class", "link-line")
      .attr("stroke", d => {
        if (d.type === "antagonist") return "red";
        if (d.type === "synergy") return "green";
        return "blue";
      })
      .attr("stroke-width", 2);

    // GAMBAR NODE + TEKS
    const node = svg.append("g")
      .selectAll("g")
      .data(data.nodes)
      .enter()
      .append("g")
      .on("click", function(event, d) {
        let info = "<strong>" + d.label + "</strong><br/>";
        info += "Peran: " + d.role + "<br/><hr style='margin:5px 0'><em>Interaksi:</em>";
        
        // Cari link terkait node ini
        const connections = data.links.filter(l => l.source.id === d.id || l.target.id === d.id);
        connections.forEach(c => {
            const otherId = c.source.id === d.id ? c.target.id : c.source.id;
            const status = c.type === "antagonist" ? "⚠️ Melawan" : "✅ Membantu";
            info += "<br/>&nbsp;&nbsp;- " + status + " " + otherId + ": " + c.note;
        });
        document.getElementById("info-box").innerHTML = info;
      });

    // Lingkaran
    node.append("circle")
      .attr("r", 22)
      .attr("fill", d => d.type === "mineral" ? "#4a90e2" : "#50c878");

    // Teks Inisial
    node.append("text")
      .attr("dy", "0.35em")
      .attr("text-anchor", "middle")
      .text(d => d.id);

    // PEMBARUIKAN POSISI
    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });
  </script>
</body>
</html>
